name: Windows portable package

on:
  workflow_dispatch:
  push:
    branches: [master, "codex/r2-*"]
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install and build
        shell: pwsh
        run: |
          python -m pip install -c desktop/requirements.lock -e "desktop[dev]" pyinstaller
          npm --prefix desktop/web ci
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows_portable.ps1 -Version $env:GITHUB_SHA.Substring(0,7)
      - name: Smoke test packaged server
        shell: pwsh
        run: |
          $root = Get-ChildItem dist -Directory | Select-Object -First 1
          $process = Start-Process "$($root.FullName)\MarketListener.exe" -ArgumentList "serve --data-root $env:RUNNER_TEMP\MarketListenerData --host 127.0.0.1 --port 8765 --quiet" -PassThru
          try {
            Start-Sleep -Seconds 3
            if ((Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).StatusCode -ne 200) { throw "web shell smoke test failed" }
            if ((Invoke-WebRequest http://127.0.0.1:8765/api/health -UseBasicParsing).StatusCode -ne 200) { throw "health smoke test failed" }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with: { name: MarketListener-Windows-x64, path: dist/*.zip }
      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.zip }
