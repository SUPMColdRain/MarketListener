[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor-desktop"
version = "0.1.0"
description = "行情监控和产业链图谱项目数据生产端（D0-001 空 CLI 骨架）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "jqdatasdk>=1.9,<2",
    "baostock>=0.8.9,<0.9",
    "akshare>=1.16,<2",
    "duckdb>=1.5,<2",
    "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
