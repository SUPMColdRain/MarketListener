[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-monitor-desktop"
version = "0.1.0"
description = "行情监控和产业链图谱项目数据生产端（D0-001 空 CLI 骨架）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "akshare==1.18.81",
    "baostock==0.8.9",
    "beautifulsoup4==4.15.0",
    "cryptography==45.0.7",
    "duckdb==1.5.5",
    "jqdatasdk==1.9.8",
    "jsonschema==4.26.0",
    "openpyxl==3.1.5",
    "pypdf==6.14.2",
    "pytdx==1.72",
    "tushare==1.4.29",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.11"]

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E701", "E702", "F401"]
