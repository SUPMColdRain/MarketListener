window['tql.CWServ.tdxf10_gg_jyfx_688825_0_20251231']="{\"ResultSets\":[{\"ColName\":[\"sid\",\"T003\",\"T004\"],\"Content\":[[\"1\",\"财务指标大幅变动说明\",\"1.销售费用变动幅度为50.52%，原因：公司业绩大幅增长，销售人员业绩奖金所带来的职工薪酬大幅增加，以及平台认证费、样品费持续增长。\\r\\n2.管理费用变动幅度为181.17%，原因：公司于2025年对部分符合条件的第二期员工持股计划激励对象取消服务期安排以及向董事长授予股权激励，使得股份支付金额增加。\\r\\n3.研发费用变动幅度为108.22%，原因：一方面是由于随着研发活动的持续开展，研发耗用的材料费以及研发流片增加进而分摊的折旧及摊销相应增加，另一方面，公司为持续巩固和提升核心技术优势，扩充研发团队以及提升研发人员的薪酬激励导致职工薪酬增加。\\r\\n4.财务费用变动幅度为34%，原因：公司生产经营规模不断扩大导致资金需求不断提高，随之产生较大利息支出，该等情形与公司生产经营阶段的特点相匹配。\\r\\n5.总资产变动幅度为24%，原因：随着公司持续扩产、业务规模的不断扩大。\\r\\n6.流动资产变动幅度为63.18%，原因：随着公司生产经营规模持续扩大，货币资金、存货等流动资产随之增长。\\r\\n7.非流动资产变动幅度为10.91%，原因：公司建设合肥一期生产线、合肥二期生产线及北京生产线，公司资本投入逐渐增多，固定资产、在建工程等非流动资产规模不断扩大。\\r\\n8.固定资产变动幅度为19.52%，原因：机器设备增加。\\r\\n9.无形资产变动幅度为-17%，原因：非专利技术摊销。\\r\\n10.短期借款变动幅度为438.6%，原因：公司整体经营规模的持续扩大及运营资金需求的增加。\"]]},{\"ColName\":[\"sid\",\"T003\",\"T004\"],\"Content\":[[\"2\",\"发展回顾\",\"    （一）公司主营业务及主营产品情况\\r\\n    1、公司主营业务情况\\r\\n    长鑫科技是我国规模最大、技术最先进、布局最全的DRAM研发设计制造一体化企业。自2016年成立以来，公司始终专注于DRAM产品的研发、设计、生产及销售。公司采取“跳代研发”的策略，完成了从第一代工艺技术平台到第四代工艺技术平台的量产，以及DDR4、LPDDR4X到DDR5、LPDDR5/5X等产品覆盖和迭代升级，目前公司核心产品及工艺技术已达到国际先进水平。根据Omdia的数据，按出货量和销售额统计，公司已成为中国第一、全球第四的DRAM厂商。\\r\\n    DRAM是现代信息技术和数字信息产业发展的重要基石，广泛应用于数据中心、移动设备及终端、通信、智能制造等领域。公司于2019年9月推出自主设计生产的8GbDDR4产品，实现了中国大陆DRAM产业“从零到一”的突破。同时，公司积极把握行业发展趋势，持续进行产品迭代，现已形成DDR系列、LPDDR系列等多元化产品布局，并可提供DRAM晶圆、DRAM芯片、DRAM模组等多样化的产品方案，可以有效满足服务器、移动设备、个人电脑、智能汽车等市场需求。\\r\\n    我国是全球最大的DRAM需求市场之一，而全球前三家DRAM厂商三星电子、SK海力士和美光科技长期占全球90%以上的市场份额。公司致力于持续扩充产能，不断提升全球市场份额，并为我国DRAM市场提供稳定的供应。公司在合肥、北京两地共拥有3座12英寸DRAM晶圆厂，产能规模位居中国第一、全球第四。\\r\\n    公司高度重视技术创新与先进工艺研发，建立了完善的研发创新体系，打造了经验丰富的研发团队，承担多项国家重大专项课题。通过持续不断的研发投入与技术创新，公司已形成多项科研成果，并在DRAM产品设计、制造工艺、封装测试、模组设计与应用等各业务环节构建了全面、完善的核心技术体系，主要核心技术已达到国际先进水平。截至2025年12月31日，公司共拥有3,929项境内专利（其中发明专利3,165项）以及3,043项境外专利。根据世界知识产权组织的统计数据，公司2023年国际专利申请公开数量排名全球第22位；根据美国权威专利服务机构IFI公布的数据，公司2024年美国专利授权排名全球第42位，在所有上榜的中国企业中排名第四。\\r\\n    作为DRAM产业龙头企业，经过长期发展，公司已与上下游合作伙伴共同构建了相互依存、共同发展的产业生态。公司在服务器、移动设备、个人电脑、智能汽车等各大领域积累了广泛的优质客户资源，建立了良好的品牌效应。公司与阿里云、字节跳动、腾讯、联想、小米、传音、荣耀、OPPO、vivo等行业核心客户开展了深度合作，持续赢得客户的肯定和赞誉。此外，公司积极与半导体存储设计企业、EDA厂商、材料厂商、设备及零部件厂商、存储模组厂商等紧密合作，共同推动我国DRAM市场发展和产业生态的完善。随着公司现有产能逐步释放以及规划建设产能逐步完成，公司将持续提升市场份额，以存储科技赋能信息社会，成为技术领先与商业成功的半导体存储企业。\\r\\n    2、公司的主要产品及服务\\r\\n    公司产品覆盖DDR、LPDDR两大主流系列，并且各系列均能提供当前市场主流的第四代、第五代产品，包括DDR4、DDR5、LPDDR4X、LPDDR5/5X等，产品广泛应用于服务器、移动设备、个人电脑、智能汽车等市场领域。公司可结合不同产品的应用特点和不同客户的需求，提供DRAM晶圆、DRAM芯片、DRAM模组等多元化的产品方案，其中DRAM芯片是报告期内公司出货及销售的主要产品类型。凭借丰富的产品布局和卓越的产品性能，公司能够为客户提供全面的DRAM存储解决方案。\\r\\n    （1）DRAM芯片\\r\\n    1）DDR系列\\r\\n    ①DDR4\\r\\n    公司凭借长期的技术积累与创新，推出了自主设计、研发、生产的DDR4芯片，公司的DDR4芯片具备多领域的应用支持能力，可以满足多产品组合使用需求，为数据存储和高速传输提供高可靠性保障。目前，公司结合下游应用市场发展趋势，通过技术迭代推出了DDR5等新代际产品。2024年底以来，长鑫科技自有DDR4产品已停止生产。\\r\\n    ②DDR5\\r\\n    随着新一代信息技术的发展，各类终端电子设备对数据处理的性能和系统功耗的要求持续提升，下游市场对高性能内存的需求快速增长。DDR5作为新一代DDR内存芯片，凭借更高的带宽和更低的功耗，正在快速取代DDR4，应用于中高端市场。基于目前DRAM产品的迭代趋势，公司推出了DDR5产品并完成量产，产品性能达到国际先进水平，广泛应用于服务器、个人电脑等领域，实现了更加全面的下游市场覆盖。\\r\\n    2）LPDDR\\r\\n    ①LPDDR4X\\r\\n    LPDDR芯片通过减小存储器与CPU之间的导线电阻和通道宽度实现低功率的运行，主要应用于智能手机、平板电脑等便携式设备。相较于LPDDR4芯片，LPDDR4X芯片在封装方式、引脚设计、接口设计等方面进行了优化，在相同性能与速率的情况下能够实现更低的功耗与更好的稳定性。公司的LPDDR4X芯片兼具大容量、高速率、高带宽和低功耗的特点，能够提供稳定流畅的使用体验，目前已进入小米、OPPO、vivo、传音、联想等主流厂商供应链，在智能手机等终端产品中实现广泛应用，并通过相关终端渠道走向海外市场。\\r\\n    ②LPDDR5/5X\\r\\n    公司自主设计研发生产的LPDDR5/5X芯片具备大容量、高速率、超低功耗与高安全性等特性，相较于上一代LPDDR4X芯片，公司的LPDDR5/5X芯片单一颗粒的容量和速率均大幅提升，同时功耗进一步降低。此外，公司LPDDR5/5X芯片加入了强大的RAS功能，通过内置纠错码（On-dieECC）等技术，能够实现实时纠错，有效减少系统故障，确保数据安全，增强系统稳定性。公司LPDDR5/5X内存芯片能够有效满足中高端智能手机、笔记本电脑、AIoT等市场需求，相关产品目前已进入小米、传音等品牌供应链。\\r\\n    （2）DRAM模组\\r\\n    公司基于自身原厂DRAM芯片生产制造的DRAM模组包括DDR4、DDR5系列，涵盖RDIMM、MRDIMM、UDIMM/CUDIMM、SODIMM/CSODIMM、LPCAMM等不同类型产品。其中RDIMM和MRDIMM主要应用于服务器领域，UDIMM/CUDIMM主要应用于计算机工作站、台式电脑，SODIMM/CSODIMM主要应用于笔记本电脑、一体机主机中，LPCAMM主要应用于高性能笔记本电脑、移动工作站等。公司DDR4模组包含8GB/16GB/32GB/64GB等多种容量规格，速率可达3200Mbps。DDR5模组包含8GB/16GB/32GB/64GB/96GB/128GB等多种容量规格，速率可达8000Mbps及以上。\\r\\n    （3）DRAM晶圆\\r\\n    报告期内，公司存在少量DRAM晶圆销售，DRAM晶圆即公司完成技术研发、产品设计及生产制造流程后，尚未切割及封装测试的产品，相关客户主要包括下游模组厂商等。\\r\\n    （4）其他产品及服务\\r\\n    公司其他产品及服务主要包括提供技术及研发服务、晶圆代工服务及配套光罩产品销售等。\"]]},{\"ColName\":[\"sid\",\"T003\",\"T004\"],\"Content\":[[\"3\",\"未来展望\",\"    （一）公司战略规划\\r\\n    长鑫科技秉持“以存储科技赋能信息社会、改善人类生活”的使命，在业务布局上坚持立足国内市场，并逐步拓展海外市场；在市场布局上加速扩大在中高端应用市场的占有率；在发展模式上持续向产业生态协同发展；在技术研发上持续深化工艺技术开发与积累，不断开拓前沿技术，加速实现中国先进DRAM芯片产业持续性的技术突破。公司致力于成为技术领先与商业成功的半导体存储企业，并一直为之不懈努力和奋斗。\\r\\n    （二）发行人报告期内为实现战略目标已采取的措施及实施效果\\r\\n    为实现公司的总体发展战略和经营目标，公司在报告期内具体实施了以下举措：\\r\\n    1、坚持高水平技术研发，致力于创新驱动发展\\r\\n    公司高度重视技术创新与先进工艺研发，建立了完善的研发创新体系，打造了经验丰富的研发团队，承担多项国家重大专项课题，截至2025年12月31日，公司拥有6,259名研发人员，占公司员工总数的比例超过30%。报告期内，公司累计研发投入为2,060,501.67万元，占累计营业收入的21.67%。技术平台方面，公司始终坚持自主研发道路，并通过跳代研发加快技术创新，完成了从第一代工艺技术平台到第四代工艺技术平台的量产。公司于2019年9月推出自主设计生产的8GbDDR4产品，实现了中国大陆DRAM产业“从零到一”的突破。截至2025年12月31日，已完成LPDDR4X、DDR5和LPDDR5/5X的开发与量产。通过持续不断的研发投入与技术创新，公司已形成多项科研成果及核心技术，截至2025年12月31日，公司共拥有3,929项境内专利（其中发明专利3,165项）以及3,043项境外专利。\\r\\n    2、加快产能建设，丰富产品组合\\r\\n    报告期内，公司持续提升产能以满足下游市场需求。基于出货量和销售额统计，公司均是中国第一、全球第四的DRAM厂商。未来，随着公司产线建设的稳步推进，公司整体产能将持续提升，预计将进一步提升在全球市场的竞争力。\\r\\n    在产品矩阵方面，公司积极拓展产品组合以满足各类下游市场需要，已形成DDR系列、LPDDR系列等的多元化产品布局，并可提供内存DRAM晶圆、内存DRAM芯片、内存DRAM模组等多样化的产品方案，可以有效满足服务器、移动设备、个人电脑、智能汽车等市场需求，并正在积极布局并计划推出更新代际的产品，以持续满足未来新一代信息技术产业快速发展的需求。\\r\\n    3、推动供应链建设，带动上下游企业共同发展\\r\\n    报告期内，公司围绕供应链建设采取了一系列措施，充分整合利用龙头企业资源优势，推动科研院所、高校与产业上下游关键企业广泛参与，重点聚焦供应链的开发与验证，有效带动半导体设备、半导体材料等相关上下游产业链核心环节的协同发展。\\r\\n    4、吸引、培养和保留关键人才，强化约束与激励机制\\r\\n    人才是集成电路企业持续发展的根本，对于需持续追求先进工艺的DRAM行业而言，关键人才显得尤为重要。一方面，公司持续优化薪酬制度和激励体系，不断激发核心人才队伍的创新动力，将公司未来发展与关键人才深度绑定；另一方面，公司持续加大对关键人才培养的投入，为其搭建清晰的职业发展通道，并通过打造优质内部师资团队、开发各类课程培训体系、与国内各大高校合作等多种方式，以实现人才成长和公司发展的双赢效果。\\r\\n    （三）发行人未来具体发展计划及采取的措施\\r\\n    未来，公司将继续坚持当前战略规划，坚持高水平技术研发，持续深化工艺技术开发与积累、不断开拓前沿技术，夯实核心技术根基；加速产能布局建设，拓展多元化产品组合，积极探索和布局中高端细分市场及海外市场；提升团队建设，强化运营能力，夯实人才密度，不断提升公司市场地位和竞争优势。同时，公司将积极拓展融资渠道，进一步结合市场及自身情况进行资本开支，以更好支撑未来战略发展。\\r\\n    本次募集资金运用安排中，公司结合未来发展计划，拟将募集资金投入于存储器晶圆制造量产线技术升级改造项目、DRAM存储器技术升级项目、动态随机存取存储器前瞻技术研究与开发项目。项目实施后，能够满足公司在DRAM行业进一步提高技术及研发实力和加快产能建设与升级的需要，是公司持续深化工艺技术开发与积累、不断开拓前沿技术、加速产能建设、提升核心竞争力的重要举措，有利于公司迈向技术领先和商业成功的半导体存储企业发展目标的实现。\"]]}],\"ErrorCode\":0}";
