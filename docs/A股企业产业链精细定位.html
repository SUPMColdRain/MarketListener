<style>
/* ===== THEME VARS ===== */
:root{
  --bg:#0d0f14;--bg2:#14161e;--bg3:#1c1f2a;--bg4:#22263a;--bg5:#2a2f45;
  --border:#2c3050;--text:#e2e6f3;--text2:#9aa2c0;--text3:#5a6080;--text4:#3a4060;
  --accent:#7c6ee8;--shadow:rgba(0,0,0,.5);
  --tag-bg:#1c2035;--tag-bd:#2c3460;
  --card-hover:#242848;
  --rank1:#f5c840;--rank2:#b8bec8;--rank3:#cd8b52;
  --up-color:#3d9e75;--mid-color:#7c6ee8;--dn-color:#d4537e;
  --pill-bg:rgba(255,255,255,.06);
}
.light{
  --bg:#f4f6fb;--bg2:#ffffff;--bg3:#edf0f8;--bg4:#e4e8f4;--bg5:#d8dcec;
  --border:#cdd3e8;--text:#1a1e32;--text2:#4a5275;--text3:#8090b8;--text4:#b0bcda;
  --shadow:rgba(0,0,0,.12);
  --tag-bg:#eaedf8;--tag-bd:#cdd3e8;
  --card-hover:#eef0fc;
  --up-color:#1c8a60;--mid-color:#5a4fd0;--dn-color:#b8355e;
  --pill-bg:rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;display:flex;height:100vh;overflow:hidden;transition:background .25s,color .25s}

/* ===== SIDEBAR ===== */
#sb{width:230px;min-width:230px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:background .25s}
#sb-hdr{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
#sb-title{font-size:13px;font-weight:700;letter-spacing:.4px}
#sb-sub{font-size:11px;color:var(--text3);margin-top:2px}
#search{display:block;width:100%;margin-top:9px;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;outline:none;transition:border .15s}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--text4)}
#chain-nav{flex:1;overflow-y:auto;padding:6px 0}
#chain-nav::-webkit-scrollbar{width:3px}
#chain-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chain-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .12s,border-color .12s}
.chain-btn:hover{background:var(--bg3)}
.chain-btn.act{background:var(--bg4);border-left-color:var(--accent)}
.c-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chain-btn-info{flex:1;min-width:0}
.cbn{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbs{font-size:10px;color:var(--text3);margin-top:1px}

/* ===== MAIN ===== */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#top-bar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2);transition:background .25s;flex-shrink:0}
#top-chain-name{font-size:16px;font-weight:700}
#top-chain-desc{font-size:11px;color:var(--text3);margin-top:2px}
#top-badge{margin-left:auto;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid;transition:all .25s}
#theme-btn{margin-left:10px;padding:4px 12px;border-radius:8px;font-size:11px;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--text2);white-space:nowrap;transition:all .15s}
#theme-btn:hover{background:var(--bg4)}

/* ===== STATS BAR ===== */
#stats-bar{padding:6px 20px;border-bottom:1px solid var(--border);display:flex;gap:16px;font-size:11px;color:var(--text3);background:var(--bg);flex-shrink:0;transition:background .25s}
.stat-item span{color:var(--text);font-weight:600}

/* ===== CANVAS ===== */
#canvas{flex:1;overflow:auto;padding:20px}
#canvas::-webkit-scrollbar{height:6px;width:6px}
#canvas::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== FLOW ===== */
.flow{display:flex;align-items:flex-start;gap:0;min-width:max-content}
.stage-wrap{display:flex;align-items:flex-start}
.stage-col{min-width:190px;max-width:210px;display:flex;flex-direction:column}
.stage-hdr{margin:0 6px;border-radius:8px 8px 0 0;padding:8px 10px 6px;text-align:center;border:1px solid;border-bottom:none}
.stage-hdr-label{font-size:11px;font-weight:700;letter-spacing:.6px}
.stage-hdr-sub{font-size:9.5px;margin-top:2px;opacity:.75;line-height:1.3}
.stage-hdr-count{font-size:9px;opacity:.6;margin-top:3px}
.stage-body{margin:0 6px;background:var(--bg2);border:1px solid var(--border);border-radius:0 0 8px 8px;overflow:hidden;transition:background .25s,border-color .25s}
.co-scroll{max-height:320px;overflow-y:auto}
.co-scroll::-webkit-scrollbar{width:3px}
.co-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.co-item{padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative}
.co-item:last-child{border-bottom:none}
.co-item:hover{background:var(--card-hover)}
.co-item.hl{background:rgba(124,110,232,.12)!important}
.co-row1{display:flex;align-items:center;gap:5px}
.co-rank{font-size:9px;font-weight:700;min-width:16px;text-align:center;padding:1px 3px;border-radius:3px}
.co-name{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-code{font-size:10px;color:var(--text3);font-family:monospace}
.co-row2{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}
.co-tag{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--tag-bg);border:1px solid var(--tag-bd);color:var(--text2);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.co-rev{font-size:9px;color:var(--text3);margin-left:auto;white-space:nowrap}

/* ===== ARROWS ===== */
.arrow-col{display:flex;align-items:center;padding-top:30px;flex-shrink:0;padding-left:2px;padding-right:2px}

/* ===== RANK COLORS ===== */
.r1{background:var(--rank1);color:#000}
.r2{background:var(--rank2);color:#000}
.r3{background:var(--rank3);color:#fff}
.rn{background:var(--pill-bg);color:var(--text3)}

/* ===== STAGE TYPE header colors ===== */
.upstream .stage-hdr{background:rgba(29,154,117,.08);border-color:rgba(29,154,117,.35);color:#1d9a75}
.mid1 .stage-hdr{background:rgba(124,110,232,.08);border-color:rgba(124,110,232,.35);color:#9080f0}
.mid2 .stage-hdr{background:rgba(100,90,220,.08);border-color:rgba(100,90,220,.3);color:#8070e8}
.mid3 .stage-hdr{background:rgba(80,70,200,.08);border-color:rgba(80,70,200,.3);color:#7060e0}
.downstream .stage-hdr{background:rgba(212,83,126,.08);border-color:rgba(212,83,126,.35);color:#d4537e}

.light .upstream .stage-hdr{background:rgba(29,154,117,.06);border-color:rgba(29,154,117,.3);color:#177a5a}
.light .mid1 .stage-hdr{background:rgba(100,90,220,.06);border-color:rgba(100,90,220,.3);color:#5040b8}
.light .mid2 .stage-hdr{background:rgba(80,70,200,.06);border-color:rgba(80,70,200,.3);color:#4535a8}
.light .mid3 .stage-hdr{background:rgba(70,60,190,.06);border-color:rgba(70,60,190,.3);color:#3830a0}
.light .downstream .stage-hdr{background:rgba(185,53,94,.06);border-color:rgba(185,53,94,.3);color:#a82050}

/* ===== TYPE LEGEND ===== */
.legend{display:flex;gap:12px;padding:0 0 16px;flex-wrap:wrap;align-items:center}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3)}
.leg-dot{width:8px;height:8px;border-radius:2px}

/* ===== TOOLTIP ===== */
#tooltip{position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:11px;pointer-events:none;display:none;z-index:9999;box-shadow:0 8px 24px var(--shadow);max-width:260px}
.tt-title{font-weight:700;font-size:13px;margin-bottom:4px}
.tt-code{font-family:monospace;color:var(--text3);font-size:10px}
.tt-row{display:flex;justify-content:space-between;margin-top:5px;gap:16px}
.tt-label{color:var(--text3)}
.tt-val{font-weight:600;color:var(--text)}
.tt-products{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.tt-tag{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--tag-bg);border:1px solid var(--tag-bd);color:var(--text2)}
.tt-chain{font-size:9px;color:var(--accent);margin-top:5px}

/* ===== EMPTY ===== */
.stage-empty{padding:12px 10px;text-align:center;font-size:11px;color:var(--text4)}
</style>

let dark = true;
let activeIdx = null;
let searchQ = '';

function toggleTheme(){
  dark = !dark;
  document.body.classList.toggle('light', !dark);
  document.getElementById('theme-btn').textContent = dark ? '☀ 明亮模式' : '☾ 深色模式';
}

// build sidebar
const nav = document.getElementById('chain-nav');
DATA.forEach((chain, i) => {
  const total = chain.stages.reduce((a, s) => a + s.companies.length, 0);
  const btn = document.createElement('div');
  btn.className = 'chain-btn';
  btn.dataset.i = i;
  btn.innerHTML = `<div class="c-dot" style="background:${chain.color}"></div>
    <div class="chain-btn-info">
      <div class="cbn">${chain.name}</div>
      <div class="cbs">${chain.stages.length} 环节 · ${total} 家</div>
    </div>`;
  btn.onclick = () => select(i);
  nav.appendChild(btn);
});

function select(i){
  activeIdx = i;
  document.querySelectorAll('.chain-btn').forEach(b => b.classList.remove('act'));
  nav.querySelectorAll('.chain-btn')[i].classList.add('act');
  render(DATA[i]);
}

function fmtNum(v){
  if(v == null) return '–';
  if(v >= 10000) return (v/10000).toFixed(1) + '万亿';
  if(v >= 1) return v.toFixed(2) + '亿';
  return (v*10000).toFixed(0) + '万';
}

function rankClass(r){
  if(r===0) return 'r1';
  if(r===1) return 'r2';
  if(r===2) return 'r3';
  return 'rn';
}
function rankLabel(r){
  if(r===0) return '①';
  if(r===1) return '②';
  if(r===2) return '③';
  return '#'+(r+1);
}

function render(chain){
  const badge = document.getElementById('top-badge');
  badge.style.display = '';
  badge.style.background = chain.color + '18';
  badge.style.color = chain.color;
  badge.style.borderColor = chain.color + '55';
  badge.textContent = chain.stages.reduce((a,s)=>a+s.companies.length,0) + ' 家';
  document.getElementById('top-chain-name').textContent = chain.name;
  document.getElementById('top-chain-desc').textContent = chain.stages.map(s=>s.label).join(' → ');

  // stats
  const total = chain.stages.reduce((a,s)=>a+s.companies.length,0);
  const upCnt = chain.stages.filter(s=>s.type==='upstream').reduce((a,s)=>a+s.companies.length,0);
  const dnCnt = chain.stages.filter(s=>s.type==='downstream').reduce((a,s)=>a+s.companies.length,0);
  document.getElementById('s-cur').textContent = total;
  document.getElementById('s-up').textContent = upCnt;
  document.getElementById('s-mid').textContent = total - upCnt - dnCnt;
  document.getElementById('s-dn').textContent = dnCnt;

  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';

  // legend
  const leg = document.createElement('div');
  leg.className = 'legend';
  leg.innerHTML = `
    <div class="leg-item"><div class="leg-dot" style="background:#1d9a75"></div>上游原材料</div>
    <div class="leg-item"><div class="leg-dot" style="background:#9080f0"></div>中游加工制造</div>
    <div class="leg-item"><div class="leg-dot" style="background:#d4537e"></div>下游应用</div>
    <div class="leg-item" style="margin-left:8px"><div class="co-rank r1" style="font-size:9px;padding:1px 4px;border-radius:3px">①</div> 营收第一（环节龙头）</div>
    <div class="leg-item"><div class="co-rank r2" style="font-size:9px;padding:1px 4px;border-radius:3px">②</div> 第二</div>
    <div class="leg-item"><div class="co-rank r3" style="font-size:9px;padding:1px 4px;border-radius:3px">③</div> 第三</div>`;
  canvas.appendChild(leg);

  const flow = document.createElement('div');
  flow.className = 'flow';

  chain.stages.forEach((stage, si) => {
    if(si > 0){
      const arr = document.createElement('div');
      arr.className = 'arrow-col';
      arr.innerHTML = `<svg width="34" height="14" viewBox="0 0 34 14">
        <line x1="0" y1="7" x2="24" y2="7" stroke="${chain.color}" stroke-width="1.5" opacity=".7"/>
        <polygon points="22,3 32,7 22,11" fill="${chain.color}" opacity=".7"/>
      </svg>`;
      flow.appendChild(arr);
    }

    const wrap = document.createElement('div');
    wrap.className = 'stage-wrap';

    const col = document.createElement('div');
    col.className = `stage-col ${stage.type}`;

    // header
    const hdr = document.createElement('div');
    hdr.className = 'stage-hdr';
    hdr.innerHTML = `<div class="stage-hdr-label">${stage.label}</div>
      <div class="stage-hdr-sub">${stage.sub}</div>
      <div class="stage-hdr-count">${stage.companies.length} 家</div>`;
    col.appendChild(hdr);

    // body
    const body = document.createElement('div');
    body.className = 'stage-body';

    const scroll = document.createElement('div');
    scroll.className = 'co-scroll';

    if(stage.companies.length === 0){
      scroll.innerHTML = '<div class="stage-empty">暂无数据</div>';
    } else {
      stage.companies.forEach((co, ri) => {
        const item = document.createElement('div');
        item.className = 'co-item';
        item.dataset.name = co.name;
        item.dataset.code = co.code;
        const rc = rankClass(ri);
        const rl = rankLabel(ri);
        const prods = (co.products||[]).slice(0,3);
        item.innerHTML = `
          <div class="co-row1">
            <div class="co-rank ${rc}">${rl}</div>
            <div class="co-name">${co.name}</div>
            <div class="co-code">${co.code}</div>
          </div>
          <div class="co-row2">
            ${prods.map(p=>`<div class="co-tag" title="${p}">${p}</div>`).join('')}
            <div class="co-rev">${co.revenue ? fmtNum(co.revenue) : ''}</div>
          </div>`;
        item.addEventListener('mouseenter', e => showTip(e, co, chain.name, ri));
        item.addEventListener('mouseleave', hideTip);
        scroll.appendChild(item);
      });
    }

    body.appendChild(scroll);
    col.appendChild(body);
    wrap.appendChild(col);
    flow.appendChild(wrap);
  });

  canvas.appendChild(flow);
}

// TOOLTIP
const tip = document.getElementById('tooltip');
function showTip(e, co, chainName, rank){
  document.getElementById('tt-name').textContent = co.name;
  document.getElementById('tt-code').textContent = co.code + '  ·  ' + co.industry;
  document.getElementById('tt-rev').textContent = co.revenue ? fmtNum(co.revenue)+'（季度营收）' : '–';
  document.getElementById('tt-mv').textContent = co.market_cap ? fmtNum(co.market_cap) : '–';
  const tp = document.getElementById('tt-products');
  tp.innerHTML = (co.products||[]).map(p=>`<div class="tt-tag">${p}</div>`).join('');
  document.getElementById('tt-chain').textContent = '所属链：'+chainName + '  环节排名：' + (rank+1);

  tip.style.display = 'block';
  const x = Math.min(e.clientX + 12, window.innerWidth - 280);
  const y = Math.min(e.clientY + 12, window.innerHeight - 200);
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
function hideTip(){ tip.style.display = 'none'; }

// SEARCH
document.getElementById('search').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  searchQ = q;

  // filter sidebar chains
  nav.querySelectorAll('.chain-btn').forEach((btn, i) => {
    if(!q){ btn.style.display = ''; return; }
    const chain = DATA[i];
    const hit = chain.name.toLowerCase().includes(q) ||
      chain.stages.some(s => s.companies.some(c =>
        c.name.toLowerCase().includes(q) ||
        c.code.includes(q) ||
        (c.products||[]).some(p => p.toLowerCase().includes(q))
      ));
    btn.style.display = hit ? '' : 'none';
  });

  // highlight in canvas
  if(activeIdx !== null){
    document.querySelectorAll('.co-item').forEach(item => {
      if(!q){ item.classList.remove('hl'); return; }
      const hit = item.dataset.name.toLowerCase().includes(q) ||
                  item.dataset.code.includes(q);
      item.classList.toggle('hl', hit);
    });
  }
});

// default select first
select(0);
</script>
